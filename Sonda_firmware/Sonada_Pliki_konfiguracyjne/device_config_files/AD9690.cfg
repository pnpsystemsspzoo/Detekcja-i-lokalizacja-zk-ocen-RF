#Memory map register config file for AD9690
#Defined on the basis of the documentation for the device, Table 36.

#Each row in the memory map register table has eight bit locations. 
#The memory map is divided into four sections: the Analog Devices 
#SPI registers (Register 0x000 to Register 0x00D), the analog input 
#buffer control registers, the ADC function registers, the DDC function 
#registers, and the digital outputs and test modes registers.
#Table 36 (see the Memory Map Register Table section) documents the 
#default hexadecimal value for each hexadecimal address shown. 
#The column with the heading Bit 7 (MSB) is the start of the default 
#hexadecimal value given. For example, Address 0x561, the output mode 
#register, has a hexadecimal default value of 0x01, which means that 
#Bit 0 = 1, and the remaining bits are 0s. This setting is the default 
#output format value, which is twos complement. For more information on 
#this function and others, see the Table 36.

