#Radiocard TETRA Configuration File
#GPIO Expanders configuration

#MCP23017 nr 0x27 Supp LMK|LTC
device = MCP23017 
i2c_addr = 0x27
i2c_num = /dev/i2c-1 
pins_mode = 0x4C8C
pins_state = 0x3132
pins_pull_Up = 0x4808


#MCP23017 nr 0x26 EN RF Peak Detector
device = MCP23017 
i2c_addr = 0x26
i2c_num = /dev/i2c-1 
pins_mode = 0x0400
pins_state = 0x0200
pins_pull_Up = 0x0000


#MCP23017 nr 0x27 Supp ATT, AMP and Peak Detector
device = MCP23017 
i2c_addr = 0x27
i2c_num = /dev/i2c-1 
pins_mode = 0x4C8C
pins_state = 0x3133
pins_pull_Up = 0x4808

time=500

#Clock distributor LMK04610 configuration data Expander U8 CS - pin GPA5 (SPI_CS_PIN - number of PIN) 
device = LMK04610 
spi_cs_addr = 0x27 
spi_cs_pin = 0x05 
spi_num = /dev/spidev0.0 
clkdist_path_cfg = ./device_config_files/radio_config_files/radiocard2/LMK04610.txt 


#ADC LTC2122 configuration data, Expander U8 CS - pin GPA4 (SPI_CS_PIN - number of PIN) 
device = LTC2122 
spi_cs_addr = 0x27 
spi_cs_pin = 0x04 
spi_num = /dev/spidev0.0 
adc2_path_cfg = ./device_config_files/radio_config_files/radiocard2/LTC2122.cfg   
